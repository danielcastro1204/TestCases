name: CI / CD Pipeline

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:
    inputs:
      testTag:
        description: 'Tag de Karate a ejecutar, con o sin @ (ej: Issue-3 o @Issue-3). Vacío = suite completa.'
        required: false
        default: ''

# Permisos mínimos: leer el código y comentar/etiquetar Issues
permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk-${{ env.JAVA_VERSION }}-${{ hashFiles('**/build.gradle', '**/settings.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk-${{ env.JAVA_VERSION }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # El valor del input NO se interpola en el script: se lee desde una variable de entorno
      # y se valida con una expresión regular antes de usarlo (evita inyección de comandos).
      - name: Resolve Karate tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.testTag }}
        run: |
          tag="$(printf '%s' "${INPUT_TAG}" | tr -d '[:space:]')"
          if [ -n "$tag" ]; then
            tag="${tag#@}"
            if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              echo "::error::Tag inválido. Use solo letras, números, guion y guion bajo (ej: Issue-3 o @Issue-3)."
              exit 1
            fi
            tag="@$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag de Karate: '${tag:-<suite completa>}'"

      - name: Run Karate tests
        id: test_execution
        continue-on-error: true
        env:
          KARATE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -n "$KARATE_TAG" ]; then
            ./gradlew clean test --no-daemon --console=plain --stacktrace -Dkarate.options="--tags $KARATE_TAG"
          else
            ./gradlew clean test --no-daemon --console=plain --stacktrace
          fi

      # Resultado REAL tomado del resumen JSON que genera Karate
      - name: Read Karate results
        id: results
        if: always()
        run: |
          summary="target/karate-reports/karate-summary-json.txt"
          if [ ! -f "$summary" ]; then
            echo "::warning::No se generó $summary (las pruebas no llegaron a ejecutarse)."
            passed=0; failed=0
          else
            passed=$(jq -r '.scenariosPassed // 0' "$summary")
            failed=$(jq -r '.scenariosfailed // 0' "$summary")
          fi
          total=$((passed + failed))
          if [ "$total" -eq 0 ]; then
            status="failed"; reason="no se ejecutó ningún escenario"
          elif [ "$failed" -gt 0 ] || [ "${{ steps.test_execution.outcome }}" != "success" ]; then
            status="failed"; reason="$failed escenario(s) fallido(s)"
          else
            status="passed"; reason="todos los escenarios aprobaron"
          fi
          echo "passed=$passed"  >> "$GITHUB_OUTPUT"
          echo "failed=$failed"  >> "$GITHUB_OUTPUT"
          echo "total=$total"    >> "$GITHUB_OUTPUT"
          echo "status=$status"  >> "$GITHUB_OUTPUT"
          echo "reason=$reason"  >> "$GITHUB_OUTPUT"
          {
            echo "## Resultado de Karate"
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\` (vacío = suite completa)"
            echo "- Escenarios ejecutados: $total | aprobados: $passed | fallidos: $failed"
            echo "- Estado: **$status** ($reason)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List output (debug)
        if: always()
        run: |
          ls -la target/karate-reports || true
          ls -la build/test-results/test || true

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports
          if-no-files-found: warn

      - name: Upload Gradle/JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test
            build/reports/tests/test
          if-no-files-found: warn

      # Solo en ejecución manual con un tag @Issue-N
      - name: Update GitHub Issue with real result
        if: always() && github.event_name == 'workflow_dispatch' && contains(steps.tag.outputs.tag, 'Issue-')
        uses: actions/github-script@v7
        env:
          KARATE_TAG: ${{ steps.tag.outputs.tag }}
          TEST_STATUS: ${{ steps.results.outputs.status }}
          TEST_REASON: ${{ steps.results.outputs.reason }}
          TOTAL: ${{ steps.results.outputs.total }}
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
        with:
          script: |
            const tag = process.env.KARATE_TAG;
            const m = tag.match(/^@Issue-(\d+)$/);
            if (!m) { core.warning(`El tag ${tag} no tiene formato @Issue-N; no se actualiza ningún Issue.`); return; }
            const issue_number = parseInt(m[1], 10);
            const { owner, repo } = context.repo;

            // 1. Verificar que el Issue existe
            try {
              await github.rest.issues.get({ owner, repo, issue_number });
            } catch (e) {
              core.warning(`El Issue #${issue_number} no existe o no es accesible: ${e.message}`);
              return;
            }

            const passed = process.env.TEST_STATUS === 'passed';
            const newLabel = passed ? 'automated-passed' : 'automated-failed';
            const oldLabel = passed ? 'automated-failed' : 'automated-passed';
            const labelColor = passed ? '2da44e' : 'd1242f';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // 2. Asegurar que la etiqueta existe
            try {
              await github.rest.issues.getLabel({ owner, repo, name: newLabel });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({ owner, repo, name: newLabel, color: labelColor });
              } else { throw e; }
            }

            // 3. Quitar la etiqueta contraria (si estaba) y poner la nueva (sin duplicar)
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: oldLabel });
            } catch (e) {
              if (e.status !== 404) { core.warning(`No se pudo quitar ${oldLabel}: ${e.message}`); }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [newLabel] });

            // 4. Comentario con el resultado real
            const body = [
              `${passed ? '✅' : '❌'} **Resultado de automatización: ${passed ? 'PASSED' : 'FAILED'}**`,
              '',
              `- Caso de prueba / tag: \`${tag}\``,
              `- Escenarios ejecutados: ${process.env.TOTAL} (aprobados: ${process.env.PASSED}, fallidos: ${process.env.FAILED})`,
              `- Detalle: ${process.env.TEST_REASON}`,
              `- Ejecución: ${runUrl}`,
              `- Fecha: ${new Date().toISOString()}`,
              '',
              '_Actualizado automáticamente por GitHub Actions_'
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`Issue #${issue_number} actualizado: ${newLabel}`);

      # El workflow debe reflejar el fallo real aunque los pasos anteriores usaran continue-on-error
      - name: Fail workflow if tests failed
        if: always() && steps.results.outputs.status != 'passed'
        run: |
          echo "::error::Pruebas fallidas o no ejecutadas: ${{ steps.results.outputs.reason }}"
          exit 1
